<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tin Tức Đường Phố</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#151515;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
header{background:#111820;color:#fff;padding:16px 18px;position:sticky;top:0;z-index:20}
.head{max-width:900px;margin:auto;display:flex;justify-content:space-between;align-items:center}.logo{font-size:22px;font-weight:800}.admin{color:#fff;text-decoration:none;font-size:14px;opacity:.8}
main{max-width:900px;margin:auto;padding:24px 14px 60px}.intro{font-size:30px;font-weight:800;margin:5px 0 20px}
.card{background:#fff;border-radius:16px;margin:18px 0;padding:16px;box-shadow:0 3px 18px #00000012}.date{color:#777;font-size:14px}.title{font-size:25px;margin:7px 0 12px}.desc{color:#555;line-height:1.5;margin-bottom:12px}
video{width:100%;display:block;border-radius:12px;background:#000;max-height:75vh}.empty{padding:35px;text-align:center;color:#777}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.84);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px}
.adbox{position:relative;width:min(94vw,600px);text-align:center}.adbox img{width:100%;height:auto;display:block;border-radius:16px;box-shadow:0 10px 40px #000}
.close{position:absolute;right:-7px;top:-18px;width:56px;height:56px;border-radius:50%;background:#fff;color:#555;text-decoration:none;font-size:42px;line-height:52px;font-weight:700;z-index:5}
.buy{display:block;background:#ee4d2d;color:#fff;text-decoration:none;padding:14px;border-radius:10px;margin-top:12px;font-weight:800}
.continue{display:none;position:fixed;inset:0;background:rgba(0,0,0,.84);z-index:90;align-items:center;justify-content:center;padding:25px}
.continue-box{background:#fff;border-radius:18px;padding:25px;text-align:center;width:min(92vw,460px)}.continue h2{margin-top:0}
.btn{display:block;border:0;border-radius:12px;padding:15px;margin:10px 0;width:100%;font-size:17px;font-weight:800;cursor:pointer}.tiktok{background:#111;color:#fff}.watch{background:#2b64f5;color:#fff}
.locked{background:#eee;border-radius:12px;padding:25px;text-align:center;color:#555}
.small{font-size:13px;color:#777;margin-top:12px}
</style>
</head>
<body>
<header><div class="head"><div class="logo">Tin Tức Đường Phố</div><a class="admin" href="admin.html">Quản lý</a></div></header>
<main><div class="intro">Blog</div><div id="posts"></div></main>

<div class="overlay" id="adOverlay">
  <div class="adbox">
    <a class="close" id="closeAd" href="https://s.shopee.vn/3qMlWZaBkP" target="_blank" rel="noopener noreferrer">×</a>
    <a href="https://s.shopee.vn/3qMlWZaBkP" target="_blank" rel="noopener noreferrer">
      <img src="https://cdn.phototourl.com/free/2026-09-01-857865cd-565f-46ac-a40e-60a1bd475fe6.jpg" alt="Quảng cáo">
    </a>
    <a class="buy" href="https://s.shopee.vn/3qMlWZaBkP" target="_blank" rel="noopener noreferrer">🛒 XEM ƯU ĐÃI TRÊN SHOPEE</a>
  </div>
</div>

<div class="continue" id="continueBox">
  <div class="continue-box">
    <h2>Tiếp tục xem video</h2>
    <p>Để tiếp tục, mở TikTok rồi quay lại trang này.</p>
    <button class="btn tiktok" id="openTikTok">▶ MỞ TIKTOK</button>
    <button class="btn watch" id="watchNow">✓ TIẾP TỤC XEM VIDEO</button>
    <div class="small">Nếu TikTok không mở ứng dụng, Safari có thể mở trang TikTok.</div>
  </div>
</div>

<script>
const TIKTOK_URL="https://vt.tiktok.com/ZS9BQgahS3qTt-stnQI/";
const SHOPEE_URL="https://s.shopee.vn/3qMlWZaBkP";
let adDone=sessionStorage.getItem("adDone")==="1";
let tikDone=sessionStorage.getItem("tikDone")==="1";

function showFlow(){
  const ad=document.getElementById("adOverlay"), cont=document.getElementById("continueBox");
  if(adDone){ad.style.display="none"; if(!tikDone) cont.style.display="flex"; else cont.style.display="none";}
  else {ad.style.display="flex";cont.style.display="none";}
}
document.getElementById("closeAd").addEventListener("click",()=>{sessionStorage.setItem("adDone","1");adDone=true;});
document.getElementById("openTikTok").addEventListener("click",()=>{sessionStorage.setItem("tikDone","1");tikDone=true;window.location.href=TIKTOK_URL;});
document.getElementById("watchNow").addEventListener("click",()=>{sessionStorage.setItem("tikDone","1");tikDone=true;document.getElementById("continueBox").style.display="none";});

async function loadPosts(){
  const box=document.getElementById("posts");
  try{
    const r=await fetch("posts.json?"+Date.now());
    const posts=await r.json();
    if(!posts.length){box.innerHTML='<div class="empty">Chưa có bài viết.</div>';return;}
    box.innerHTML=posts.map(p=>`
      <article class="card">
        <div class="date">${escapeHtml(p.date||"")}</div>
        <div class="title">${escapeHtml(p.title||"Không có tiêu đề")}</div>
        <div class="desc">${escapeHtml(p.description||"")}</div>
        ${p.video?`<video controls playsinline preload="metadata" poster="${escapeAttr(p.poster||"")}"><source src="${escapeAttr(p.video)}" type="video/mp4"></video>`:'<div class="locked">Bài viết chưa có video.</div>'}
      </article>`).join("");
  }catch(e){box.innerHTML='<div class="empty">Không tải được posts.json. Hãy kiểm tra bạn đã upload file này lên GitHub Pages chưa.</div>';}
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function escapeAttr(s){return escapeHtml(s);}
loadPosts(); showFlow();
</script>
</body>
</html>
