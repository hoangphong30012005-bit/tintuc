<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tin Tức Đường Phố</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #111;
    color: white;
}

/* ===== HEADER ===== */
.header {
    height: 60px;
    background: #1d1d1d;
    display: flex;
    align-items: center;
    padding: 0 15px;
    gap: 22px;
}

.header .logo {
    font-size: 21px;
    font-weight: bold;
}

.header .menu {
    font-size: 28px;
}

.header .right {
    margin-left: auto;
    font-size: 25px;
}

/* ===== NỘI DUNG ===== */
.container {
    max-width: 900px;
    margin: auto;
    padding: 25px 15px;
}

h1 {
    text-align: center;
    margin-bottom: 30px;
}

.article {
    background: #222;
    padding: 20px;
    border-radius: 12px;
}

.unlock-area {
    text-align: center;
    margin-top: 30px;
}

#unlockBtn {
    border: 0;
    background: #1683ff;
    color: white;
    font-size: 18px;
    font-weight: bold;
    padding: 15px 30px;
    border-radius: 10px;
    cursor: pointer;
}

#unlockBtn:hover {
    background: #006bd6;
}

/* ===== POPUP ===== */
.ad-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.82);
    z-index: 9999;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 15px;
}

.ad-box {
    position: relative;
    width: min(95vw, 650px);
    max-height: 92vh;
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 10px 50px rgba(0,0,0,.7);
}

.ad-box img {
    display: block;
    width: 100%;
    height: auto;
    max-height: 92vh;
    object-fit: contain;
}

/* Nút X */
.close-ad {
    position: absolute;
    top: 8px;
    right: 8px;

    width: 45px;
    height: 45px;

    border: 0;
    border-radius: 50%;

    background: rgba(0,0,0,.65);
    color: white;

    font-size: 32px;
    line-height: 40px;

    cursor: pointer;
    z-index: 10;
}

.close-ad:hover {
    background: rgba(0,0,0,.9);
}

/* ===== VIDEO ===== */
.videos {
    display: none;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    margin-top: 30px;
}

.video-card {
    background: #1d1d1d;
    padding: 10px;
    border-radius: 12px;
}

.video-card video {
    width: 100%;
    display: block;
    border-radius: 8px;
}

.video-title {
    font-weight: bold;
    padding: 10px 5px;
}

/* Mobile */
@media (max-width: 600px) {

    .videos {
        grid-template-columns: 1fr;
    }

    .ad-box {
        width: 96vw;
    }

    .close-ad {
        width: 40px;
        height: 40px;
        font-size: 27px;
    }

    #unlockBtn {
        width: 100%;
    }
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<div class="header">
    <div class="menu">☰</div>
    <div class="logo">Tin Tức Đường Phố</div>
    <div class="right">👤</div>
</div>


<!-- ================= NỘI DUNG ================= -->

<div class="container">

    <h1>Tin Tức Đường Phố</h1>

    <div class="article">
        <h2>Video mới nhất</h2>

        <p>
            Nội dung video được cập nhật liên tục.
        </p>

        <div class="unlock-area">
            <button id="unlockBtn">
                🔓 MỞ KHÓA VIDEO
            </button>
        </div>

        <!-- VIDEO -->
        <div class="videos" id="videos">

            <div class="video-card">
                <div class="video-title">🔊 Video 1</div>

                <video controls playsinline>
                    <source src="video1.mp4" type="video/mp4">
                    Trình duyệt không hỗ trợ video.
                </video>
            </div>

            <div class="video-card">
                <div class="video-title">🔊 Video 2</div>

                <video controls playsinline>
                    <source src="video2.mp4" type="video/mp4">
                    Trình duyệt không hỗ trợ video.
                </video>
            </div>

        </div>
    </div>

</div>


<!-- ==================================================
     QUẢNG CÁO 1 - SHOPEE
================================================== -->

<div class="ad-overlay" id="shopeeAd">

    <div class="ad-box">

        <button
            class="close-ad"
            onclick="closeShopee()">
            ×
        </button>

        <img
            src="shopee.jpg"
            alt="Quảng cáo Shopee Sunhouse">

    </div>

</div>


<!-- ==================================================
     QUẢNG CÁO 2 - TIKTOK
================================================== -->

<div
    class="ad-overlay"
    id="tiktokAd"
    style="display:none;">

    <div class="ad-box">

        <button
            class="close-ad"
            onclick="closeTiktok()">
            ×
        </button>

        <img
            src="tiktok.jpg"
            alt="Quảng cáo TikTok Shop">

    </div>

</div>


<script>

/* ==========================================
   LINK SHOPEE
========================================== */

const SHOPEE_URL = "https://shopee.vn/";

/* ==========================================
   LINK TIKTOK SHOP
========================================== */

const TIKTOK_URL = "https://www.tiktok.com/shop";


/* ==========================================
   ĐÓNG QUẢNG CÁO SHOPEE
========================================== */

function closeShopee() {

    // Ẩn quảng cáo
    document.getElementById("shopeeAd").style.display = "none";

    // Mở Shopee ở tab mới
    window.open(SHOPEE_URL, "_blank");

    // Hiện quảng cáo TikTok
    setTimeout(function() {

        document.getElementById("tiktokAd").style.display = "flex";

    }, 500);
}


/* ==========================================
   ĐÓNG QUẢNG CÁO TIKTOK
========================================== */

function closeTiktok() {

    // Ẩn quảng cáo
    document.getElementById("tiktokAd").style.display = "none";

    // Mở TikTok Shop
    window.open(TIKTOK_URL, "_blank");
}


/* ==========================================
   MỞ KHÓA VIDEO
========================================== */

document.getElementById("unlockBtn").addEventListener(
    "click",
    function() {

        const videos = document.getElementById("videos");

        videos.style.display = "grid";

        // Ẩn nút mở khóa
        this.style.display = "none";

        // Cuộn xuống phần video
        setTimeout(function() {

            videos.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });

        }, 100);

    }
);

</script>

</body>
</html>
