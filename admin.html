<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quản lý Tin Tức</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;color:#171717}
header{background:#111820;color:#fff;padding:18px}.wrap{max-width:760px;margin:auto}main{padding:18px}
h1{margin:0;font-size:24px}label{display:block;font-weight:700;margin:15px 0 7px}input,textarea{width:100%;padding:13px;border:1px solid #ccc;border-radius:10px;font-size:16px}textarea{min-height:90px}
button,a.btn{display:inline-block;border:0;border-radius:10px;padding:13px 16px;margin:10px 6px 10px 0;font-weight:800;text-decoration:none;font-size:15px;cursor:pointer}.add{background:#2563eb;color:#fff}.download{background:#159447;color:#fff}.clear{background:#ddd}.back{color:#2563eb}
.item{background:#fff;border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 2px 12px #0001}.item strong{font-size:18px}.danger{background:#d33;color:#fff;float:right}
.note{background:#fff8dc;padding:13px;border-radius:10px;line-height:1.5;margin:15px 0}
</style>
</head>
<body>
<header><div class="wrap"><h1>🛠 Quản lý bài viết</h1></div></header>
<main class="wrap">
<a class="back" href="index.html">← Xem trang đọc</a>
<div class="note"><b>Cách hoạt động:</b> thêm bài ở đây → bấm “Tải posts.json” → upload file <b>posts.json</b> mới lên GitHub, thay file cũ. Trang đọc sẽ tự hiển thị bài mới. File index.html không cần thay đổi.</div>

<label>Tiêu đề</label><input id="title" placeholder="Ví dụ: Tin mới hôm nay">
<label>Ngày</label><input id="date" placeholder="1 Tháng 9, 2026">
<label>Mô tả</label><textarea id="desc" placeholder="Nội dung ngắn của bài..."></textarea>
<label>URL video MP4</label><input id="video" placeholder="https://.../video.mp4">
<label>URL ảnh đại diện (không bắt buộc)</label><input id="poster" placeholder="https://.../anh.jpg">

<button class="add" onclick="addPost()">＋ Thêm bài</button>
<button class="download" onclick="downloadJSON()">⬇ Tải posts.json</button>
<button class="clear" onclick="resetAll()">Xóa toàn bộ dữ liệu trên máy</button>

<h2>Danh sách bài</h2><div id="list"></div>
<script>
const KEY="tintuc24_posts";
let posts=JSON.parse(localStorage.getItem(KEY)||"[]");
function save(){localStorage.setItem(KEY,JSON.stringify(posts));render();}
function addPost(){
 const title=document.getElementById("title").value.trim(),date=document.getElementById("date").value.trim(),
 desc=document.getElementById("desc").value.trim(),video=document.getElementById("video").value.trim(),poster=document.getElementById("poster").value.trim();
 if(!title||!video){alert("Hãy nhập ít nhất Tiêu đề và URL video MP4.");return;}
 posts.unshift({id:Date.now(),title,date,description:desc,video,poster});save();
 ["title","date","desc","video","poster"].forEach(id=>document.getElementById(id).value="");
}
function delPost(id){if(confirm("Xóa bài này?")){posts=posts.filter(p=>p.id!==id);save();}}
function render(){
 const box=document.getElementById("list");
 box.innerHTML=posts.length?posts.map(p=>`<div class="item"><button class="danger" onclick="delPost(${p.id})">Xóa</button><strong>${esc(p.title)}</strong><div>${esc(p.date||"")}</div><div>${esc(p.video)}</div></div>`).join(""):"Chưa có bài.";
}
function downloadJSON(){
 const blob=new Blob([JSON.stringify(posts,null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="posts.json";a.click();URL.revokeObjectURL(a.href);
}
function resetAll(){if(confirm("Xóa danh sách trên iPhone?")){posts=[];save();}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
render();
</script>
</main>
</body>
</html>
