<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quản lý Tintuc24</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;color:#171717}
.wrap{max-width:760px;margin:auto;padding:22px 16px 50px}.box{background:#fff;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 3px 16px #0001}
h1{font-size:25px;margin:0 0 8px}.muted{color:#666}label{display:block;font-weight:700;margin:15px 0 7px}
input,textarea{width:100%;padding:13px;border:1px solid #ccc;border-radius:10px;font-size:16px}textarea{min-height:90px}
button,.btn{border:0;border-radius:10px;padding:13px 16px;font-size:16px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block;margin:8px 6px 0 0}
.primary{background:#1769ff;color:#fff}.green{background:#159447;color:#fff}.gray{background:#ddd;color:#222}.red{background:#d33;color:#fff}
.hidden{display:none!important}.error{color:#c00;font-weight:700;margin-top:10px}
.item{border:1px solid #ddd;border-radius:12px;padding:14px;margin:12px 0}.item strong{font-size:18px}
.note{background:#fff8dc;padding:13px;border-radius:10px;line-height:1.5;margin:15px 0}
</style>
</head>
<body>
<div class="wrap">
<div id="login" class="box">
<h1>🔐 Quản lý Tintuc24</h1>
<p class="muted">Trang này dành cho quản trị viên.</p>
<label>Mật khẩu</label>
<input id="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu">
<button class="primary" id="loginBtn">ĐĂNG NHẬP</button>
<div id="error" class="error"></div>
</div>

<div id="panel" class="hidden">
<div class="box">
<h1>🛠 Quản lý bài viết</h1>
<p class="muted">Thêm bài mới rồi tải file <b>posts.json</b> lên GitHub.</p>
<a class="btn gray" href="index.html">← Trang đọc</a>
<button class="red" id="logout">Đăng xuất</button>
</div>

<div class="box">
<h2>＋ Thêm bài mới</h2>
<label>Tiêu đề</label><input id="title" placeholder="Tiêu đề bài">
<label>Ngày</label><input id="date" placeholder="01/09/2026">
<label>Mô tả</label><textarea id="description" placeholder="Nội dung ngắn..."></textarea>
<label>URL video 1 (MP4)</label><input id="video1" placeholder="https://.../video1.mp4">
<label>URL video 2 (MP4)</label><input id="video2" placeholder="https://.../video2.mp4">
<label>URL ảnh đại diện</label><input id="poster" placeholder="https://.../anh.jpg">
<button class="primary" id="add">＋ THÊM BÀI</button>
<button class="green" id="download">⬇ TẢI POSTS.JSON</button>
</div>

<div class="box"><h2>Danh sách bài</h2><div id="list"></div></div>
</div>
</div>

<script>
/* MẬT KHẨU QUẢN LÝ */
const ADMIN_PASSWORD="hoang2005@@";
const SESSION_KEY="tintuc24_admin_login";
const POSTS_KEY="tintuc24_admin_posts";
let posts=JSON.parse(localStorage.getItem(POSTS_KEY)||"[]");

function $(id){return document.getElementById(id)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function showPanel(){$("login").classList.add("hidden");$("panel").classList.remove("hidden");render()}
function showLogin(){$("panel").classList.add("hidden");$("login").classList.remove("hidden")}

$("loginBtn").onclick=function(){
 if($("password").value===ADMIN_PASSWORD){
   sessionStorage.setItem(SESSION_KEY,"1");$("error").textContent="";$("password").value="";showPanel();
 }else $("error").textContent="❌ Mật khẩu không đúng.";
};
$("password").addEventListener("keydown",e=>{if(e.key==="Enter")$("loginBtn").click()});
$("logout").onclick=function(){sessionStorage.removeItem(SESSION_KEY);showLogin()};

$("add").onclick=function(){
 const post={
  id:Date.now(),title:$("title").value.trim(),date:$("date").value.trim(),
  description:$("description").value.trim(),video1:$("video1").value.trim(),
  video2:$("video2").value.trim(),poster:$("poster").value.trim()
 };
 if(!post.title||!post.video1){alert("Hãy nhập tiêu đề và URL Video 1.");return}
 posts.unshift(post);localStorage.setItem(POSTS_KEY,JSON.stringify(posts));render();
 ["title","date","description","video1","video2","poster"].forEach(id=>$(id).value="");
};
function render(){
 $("list").innerHTML=posts.length?posts.map(p=>`
 <div class="item"><button class="red" style="float:right" onclick="removePost(${p.id})">Xóa</button>
 <strong>${esc(p.title)}</strong><div>${esc(p.date)}</div><div class="muted">${esc(p.video1)}</div></div>`).join(""):"<p class='muted'>Chưa có bài.</p>";
}
window.removePost=function(id){if(confirm("Xóa bài này khỏi danh sách trên thiết bị?")){posts=posts.filter(p=>p.id!==id);localStorage.setItem(POSTS_KEY,JSON.stringify(posts));render()}};
$("download").onclick=function(){
 const blob=new Blob([JSON.stringify(posts,null,2)],{type:"application/json;charset=utf-8"});
 const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="posts.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
if(sessionStorage.getItem(SESSION_KEY)==="1")showPanel();
</script>
</body>
</html>
